name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging branch to VPS
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.STAGING_SSH_HOST }}"
          test -n "${{ secrets.STAGING_SSH_USER }}"
          test -n "${{ secrets.STAGING_SSH_PRIVATE_KEY }}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.STAGING_APP_DIR || '/opt/apflow-ai' }}
          API_HEALTH_URL: ${{ vars.STAGING_API_HEALTH_URL || 'http://127.0.0.1:8000/health' }}
          API_READY_URL: ${{ vars.STAGING_API_READY_URL || 'http://127.0.0.1:8000/ready' }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          envs: APP_DIR,API_HEALTH_URL,API_READY_URL
          script_stop: true
          script: |
            set -euo pipefail

            cd "$APP_DIR"
            test -f .env.staging

            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging

            export APFLOW_ENV_FILE=.env.staging
            docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env.staging config --quiet
            docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env.staging up --build -d

            docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env.staging ps

            curl -fsS "$API_HEALTH_URL" >/dev/null
            curl -fsS "$API_READY_URL" >/dev/null
