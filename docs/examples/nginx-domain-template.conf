# Template only. Do not apply without completing:
# - docs/public_access_https_readiness.md
# - docs/reverse_proxy_security_hardening.md
# Replace apflow.example.com with the approved domain during the future domain PR.
# Certificate issuance and renewal are intentionally not configured by this file.

server {
    listen 80;
    server_name apflow.example.com;

    # Use Certbot/Caddy/proxy-specific challenge handling during the future cutover.
    # Redirect only after challenge handling is confirmed.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name apflow.example.com;

    # Placeholder paths. Do not commit real certificate paths if they reveal private layout.
    ssl_certificate /etc/letsencrypt/live/apflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apflow.example.com/privkey.pem;

    # Invoice PDFs/images and OCR processing need explicit proxy allowances.
    client_max_body_size 25m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    access_log /var/log/nginx/apflow-access.log;
    error_log /var/log/nginx/apflow-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enable HSTS only after HTTPS is stable and rollback risk is understood.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Start CSP in report-only mode after testing Next.js assets, API calls, uploads, and vendor flows.
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; report-uri /api/security/csp-report" always;

    # Optional after asset behavior is verified.
    # gzip on;
    # gzip_types text/plain text/css application/json application/javascript application/xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }
}
